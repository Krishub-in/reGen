<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80" fill="none">
  <defs>
    <!-- Cyan to emerald gradient matching Design 3 (Feature Highlight) -->
    <linearGradient id="orbitTopGradDark" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#23EDCE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="1" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="orbitBottomGradDark" x1="100%" y1="100%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#23EDCE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="1" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="centerGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Emblem -->
  <ellipse cx="80" cy="40" rx="36" ry="26" fill="url(#centerGlowDark)" />

  <!-- Top-Right Luminous Orbit Arc -->
  <path d="M 52 20 C 62 10 82 9 98 14 C 111 18 120 27 122 39 C 122 40.5 120 41 119 39.8 C 114 27.5 104 19 92 16.5 C 79 13.8 64 16.5 51.5 21.8 C 50.2 22.3 50.8 20.6 52 20 Z" 
        fill="url(#orbitTopGradDark)" 
        filter="url(#glowDark)" />
  <path d="M 66 14 C 76 9.5 90 10.5 102 15.5 C 112 19.5 119 28 121 37" 
        stroke="#34D399" 
        stroke-width="0.9" 
        stroke-linecap="round" 
        stroke-opacity="0.85" />

  <!-- Bottom-Left Luminous Orbit Arc -->
  <path d="M 108 60 C 98 70 78 71 62 66 C 49 62 40 53 38 41 C 38 39.5 40 39 41 40.2 C 46 52.5 56 61 68 63.5 C 81 66.2 96 63.5 108.5 58.2 C 109.8 57.7 109.2 59.4 108 60 Z" 
        fill="url(#orbitBottomGradDark)" 
        filter="url(#glowDark)" />
  <path d="M 94 66 C 84 70.5 70 69.5 58 64.5 C 48 60.5 41 52 39 43" 
        stroke="#34D399" 
        stroke-width="0.9" 
        stroke-linecap="round" 
        stroke-opacity="0.85" />

  <!-- Centered Brand Typography: ReGen -->
  <g transform="translate(80, 47)">
    <text text-anchor="middle" dominant-baseline="middle" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.5px">
      <tspan fill="#F8FAFC">Re</tspan><tspan fill="#00D09C">Gen</tspan>
    </text>
  </g>
</svg>
